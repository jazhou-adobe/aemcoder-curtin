<!DOCTYPE html>
<html lang="en">
<head>
  <title>Hero Block Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <header></header>
  <main>
    <div>
      <div class="hero">
        <div>
          <div>
            <picture>
              <img src="https://www.curtin.edu.au/wp-content/uploads/2023/08/aerial-view-curtin-perth-campus.jpg" alt="Curtin University campus aerial view" width="1440" height="600" />
            </picture>
          </div>
          <div>
            <h1>Shape the Future with a Curtin Education</h1>
            <p>Discover a world-class university committed to innovation, research, and real-world impact.</p>
            <p><a href="/study">Explore Courses</a></p>
          </div>
        </div>
        <div>
          <div>
            <picture>
              <img src="https://www.curtin.edu.au/wp-content/uploads/2023/08/students-collaborating.jpg" alt="Students collaborating on campus" width="1440" height="600" />
            </picture>
          </div>
          <div>
            <h1>Research That Changes Lives</h1>
            <p>From medical breakthroughs to sustainable solutions, our research makes a real difference.</p>
            <p><a href="/research">Discover Research</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
