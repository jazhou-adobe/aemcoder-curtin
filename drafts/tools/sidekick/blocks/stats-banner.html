<!DOCTYPE html>
<html lang="en">
<head>
  <title>Stats Banner Block Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <header></header>
  <main>
    <div>
      <div class="stats-banner">
        <div>
          <div>
            <h2>Curtin by the Numbers</h2>
          </div>
        </div>
        <div>
          <div>mortarboard</div>
          <div>
            <p><strong>58,000+</strong></p>
            <p>Students enrolled globally</p>
          </div>
        </div>
        <div>
          <div>globe</div>
          <div>
            <p><strong>130+</strong></p>
            <p>Countries represented on campus</p>
          </div>
        </div>
        <div>
          <div>star</div>
          <div>
            <p><strong>Top 1%</strong></p>
            <p>Universities worldwide</p>
          </div>
        </div>
        <div>
          <div>briefcase</div>
          <div>
            <p><strong>90%</strong></p>
            <p>Graduates employed within 4 months</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
