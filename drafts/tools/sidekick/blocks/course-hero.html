<!DOCTYPE html>
<html lang="en">
<head>
  <title>Course Hero Block Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <header></header>
  <main>
    <div>
      <div class="course-hero">
        <!-- Row 0: Tags — bold = primary tag, plain text = secondary tag -->
        <div>
          <div><strong>Engineering</strong> Technology</div>
        </div>
        <!-- Row 1: Course image -->
        <div>
          <div>
            <picture>
              <img src="https://www.curtin.edu.au/wp-content/uploads/2023/08/engineering-lab.jpg" alt="Engineering lab" width="1440" height="500" />
            </picture>
          </div>
        </div>
        <!-- Row 2: Key info heading (col 1) and Favourite label (col 2) -->
        <div>
          <div>
            <h3>Key Information</h3>
          </div>
          <div>Save to Favourites</div>
        </div>
        <!-- Row 3+: Key info items -->
        <div>
          <div>
            <h1>Bachelor of Engineering (Honours)</h1>
            <p>Majoring in Civil Engineering</p>
          </div>
        </div>
        <div>
          <div>Duration</div>
          <div>4 years full-time</div>
        </div>
        <div>
          <div>Location</div>
          <div>Perth, Online</div>
        </div>
        <div>
          <div>Intake</div>
          <div>Semester 1 and Semester 2</div>
        </div>
        <div>
          <div>
            <p><a href="/apply">Apply Now</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
