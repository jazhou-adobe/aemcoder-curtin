<!DOCTYPE html>
<html lang="en">
<head>
  <title>Course Search Block Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <header></header>
  <main>
    <div>
      <div class="course-search">
        <!-- Row 0: Heading -->
        <div>
          <div>
            <h2>Find Your Perfect Course</h2>
          </div>
        </div>
        <!-- Row 1: Search bar placeholder text -->
        <div>
          <div>Search by keyword, course name or ATAR score...</div>
        </div>
        <!-- Row 2: Study areas heading -->
        <div>
          <div>
            <h4>Browse by Study Area</h4>
          </div>
        </div>
        <!-- Rows 3+: Study area tiles (up to 4 per row) -->
        <div>
          <div><a href="/study/engineering">Engineering &amp; Technology</a></div>
          <div><a href="/study/business">Business &amp; Commerce</a></div>
          <div><a href="/study/health">Health Sciences</a></div>
          <div><a href="/study/science">Science</a></div>
        </div>
        <div>
          <div><a href="/study/law">Law</a></div>
          <div><a href="/study/arts">Arts &amp; Humanities</a></div>
          <div><a href="/study/education">Education</a></div>
          <div><a href="/study/architecture">Architecture &amp; Built Environment</a></div>
        </div>
        <div>
          <div><a href="/study/media">Media &amp; Communications</a></div>
          <div><a href="/study/it">Computing &amp; Security</a></div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
